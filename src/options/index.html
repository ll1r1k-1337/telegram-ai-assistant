<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки — Telegram AI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 32px 24px; background: #fafafa; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 24px; }
    .section { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .section h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: #333; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
    select, input[type="text"], input[type="password"], textarea {
      width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 13px; margin-bottom: 14px; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 80px; }
    .btn { padding: 10px 24px; background: #3390ec; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    .hint { font-size: 11px; color: #aaa; margin-top: -10px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <h1>⚙ Настройки</h1>
  <p class="subtitle">Telegram AI Assistant — конфигурация провайдера и поведения</p>

  <div class="section">
    <h2>🤖 AI Провайдер</h2>
    <label for="provider">Провайдер</label>
    <select id="provider">
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic (Claude)</option>
      <option value="ollama">Ollama (локальный)</option>
      <option value="custom">Custom (OpenAI-compatible)</option>
    </select>

    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <p class="hint">Ключ хранится локально в браузере, не передаётся никуда кроме выбранного API.</p>

    <label for="model">Модель</label>
    <input type="text" id="model" placeholder="gpt-4o-mini" value="gpt-4o-mini">

    <label for="baseUrl">Base URL (для Custom / Ollama)</label>
    <input type="text" id="baseUrl" placeholder="http://localhost:11434/v1">
  </div>

  <div class="section">
    <h2>💬 Промпт</h2>
    <label for="systemPrompt">Системный промпт (опционально)</label>
    <textarea id="systemPrompt" placeholder="Дополнительные инструкции для AI..."></textarea>
    <p class="hint">Оставьте пустым для промпта по умолчанию.</p>

    <label for="suggestionCount">Количество подсказок</label>
    <select id="suggestionCount">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3" selected>3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </div>

  <button class="btn" id="saveBtn">Сохранить</button>

  <script src="options.ts" type="module"></script>
</body>
</html>
