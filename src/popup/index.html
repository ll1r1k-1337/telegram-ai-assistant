<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram AI Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <span class="header-icon">🤖</span>
    <h1>TG AI Assistant</h1>
  </div>

  <div class="status">
    <span class="status-dot active" id="statusDot"></span>
    <span class="status-text" id="statusText">Активен на web.telegram.org</span>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Включено</span>
    <label class="toggle">
      <input type="checkbox" id="enabledToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Автоподсказки</span>
    <label class="toggle">
      <input type="checkbox" id="autoToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">
    <a href="options/index.html" target="_blank">⚙ Настройки</a>
  </div>

  <script src="popup.ts" type="module"></script>
</body>
</html>
