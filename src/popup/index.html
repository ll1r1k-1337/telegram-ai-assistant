<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram AI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; background: #fff; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .header img { width: 32px; height: 32px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 8px; padding: 10px; background: #f0f4ff; border-radius: 8px; margin-bottom: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.active { background: #22c55e; }
    .status-dot.inactive { background: #ef4444; }
    .status-text { font-size: 13px; color: #555; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .toggle-label { font-size: 13px; color: #333; }
    .toggle { position: relative; width: 40px; height: 22px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider { position: absolute; inset: 0; background: #ccc; border-radius: 22px; cursor: pointer; transition: 0.2s; }
    .toggle .slider::before { content: ''; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: 0.2s; }
    .toggle input:checked + .slider { background: #3390ec; }
    .toggle input:checked + .slider::before { transform: translateX(18px); }
    .footer { margin-top: 12px; text-align: center; }
    .footer a { font-size: 12px; color: #3390ec; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 28px;">🤖</span>
    <h1>TG AI Assistant</h1>
  </div>

  <div class="status">
    <span class="status-dot active" id="statusDot"></span>
    <span class="status-text" id="statusText">Активен на web.telegram.org</span>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Включено</span>
    <label class="toggle">
      <input type="checkbox" id="enabledToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Автоподсказки</span>
    <label class="toggle">
      <input type="checkbox" id="autoToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">
    <a href="options/index.html" target="_blank">⚙ Настройки</a>
  </div>

  <script src="popup.ts" type="module"></script>
</body>
</html>
